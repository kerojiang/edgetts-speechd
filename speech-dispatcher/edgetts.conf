# Speech Dispatcher 配置: edgetts（豆包 TTS，默认温柔桃子）
#
# 生效路径：~/.config/speech-dispatcher/modules/edgetts.conf
# 由 ~/.config/speech-dispatcher/speechd.conf 的 AddModule 加载，并设为 DefaultModule。
#
# 默认语音：zh_female_wenroutaozi_uranus_bigtts（温柔桃子·升级版）
# 换音色：改下面的 -dv 参数即可，可用音色见 `edgetts -engine doubao -l`

Debug 0

# 合成命令说明（每条都是实测约束）：
#
# 1) 用 sed 剥掉 SSML 标签。
#    speech-dispatcher 0.12.1 的 module_strip_ssml 未生效，sd_generic 会把
#    <speak>/<break .../> 原样交给命令，edgetts 会把标签当文字念出来。
#
# 2) 空文本必须 exit 0。
#    sd_generic 的子进程非 0 退出会让模块自杀（generic.c「We failed to speak,
#    kill ourself」），之后所有朗读请求卡死；纯 SSML 标签剥完就是空文本。
#
# 3) 结尾统一 exit 0，把失败原因写 stderr。
#    同理避免模块自杀；edgetts 的错误信息（stderr）会进 journal，便于排查。
#
# 4) stdout 丢弃。
#    edgetts 播放模式会打印「音频文件已生成：...」，对 sd_generic 无用。
#
# 5) 不指定 -o：让 edgetts 自己合成并播放，sd_generic 期望命令自行发声。
#
# 注意 sd_generic 会自己在命令前加 "set -o pipefail ; "，这里不重复写。
# 停止朗读由 sd_generic 按进程组 SIGKILL，ffplay 在该组内，实测可立即中断。
GenericExecuteSynth "t=$(printf %s '$DATA' | sed -e 's/<[^>]*>//g') ; if [ -z \"$t\" ]; then exit 0; fi ; /home/jie/.local/bin/edgetts -engine doubao -dv zh_female_wenroutaozi_uranus_bigtts \"$t\" >/dev/null ; rc=$? ; if [ $rc -ne 0 ]; then echo \"edgetts 朗读失败，退出码 $rc\" >&2; fi ; exit 0"

GenericCmdDependency "/home/jie/.local/bin/edgetts"
GenericSoundIconFolder "/usr/share/sounds/sound-icons/"

# 不按标点切块：sd_generic 默认 300 字符 + "." 分隔，会把 "3.14" 切成两句，
# 且每块都重启一次 edgetts（约 1.2s 开销 + 一次豆包建连）。
# edgetts 自己会按句子合成并连续播放，这里只留一个足够大的上限。
GenericMaxChunkLength 65536
GenericDelimiters ""

# ---- 语音映射 ----
# 只保留一条：默认语言 zh + 默认 voice type FEMALE1，即温柔桃子。
# 不列其他 voice type，避免 Qt/QTextToSpeech 在同 locale 多条目时随机选中非预期条目。
AddVoice	"zh"	"FEMALE1"	"zh_female_wenroutaozi_uranus_bigtts"

# ---- 语言与编码 ----
# GenericDefaultCharset 必须显式设成 utf-8：sd_generic 默认 iso-8859-1，
# 未列出的语言会按 latin-1 重编码，中文会变成一串问号。
GenericLanguage		"zh"	"chinese"	"utf-8"
GenericLanguage		"zh-CN"	"chinese"	"utf-8"
GenericLanguage		"en"	"english"	"utf-8"
GenericDefaultCharset	"utf-8"

# 语速/音调：命令未引用 $RATE/$PITCH/$VOLUME，保持单位换算（0.12 起为真浮点乘数）。
GenericRateAdd		0
GenericRateMultiply	1
GenericPitchAdd		0
GenericPitchMultiply	1
GenericVolumeAdd	0
GenericVolumeMultiply	1
