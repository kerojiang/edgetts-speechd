# Enhanced configuration for continuous ebook reading
# Optimized for foliate and other ebook readers

# Global settings for smooth continuous reading
DefaultPunctuationMode "some"
SymbolsPreproc "char"
DefaultPauseContext 0

# Client-specific configuration for foliate
BeginClient "foliate:*"
DefaultPunctuationMode "some"
SymbolsPreproc "char"
DefaultPauseContext 0
DefaultModule "edgetts"
DefaultRate 0
DefaultPitch 0
DefaultVolume 100
DefaultBoundary "SentenceBoundary"
EndClient

# Client-specific configuration for general text reading
BeginClient "*reader*"
DefaultPunctuationMode "some"
SymbolsPreproc "char"
DefaultPauseContext 0
DefaultModule "edgetts"
EndClient

# Client-specific configuration for accessibility tools
BeginClient "orca*"
DefaultPunctuationMode "some"
SymbolsPreproc "char"
DefaultPauseContext 1
DefaultModule "edgetts"
EndClient