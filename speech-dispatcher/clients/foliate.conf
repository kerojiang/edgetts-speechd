# Client-specific configuration for foliate ebook reader
# This configuration ensures continuous reading without pauses between paragraphs

BeginClient "foliate:*"

# Enable continuous playback by setting punctuation mode appropriately
DefaultPunctuationMode "some"

# Set punctuation processing to ensure smooth transitions
SymbolsPreproc "char"

# Configure timing parameters for smoother reading
DefaultPauseContext 0

# Ensure the edgetts module is used
DefaultModule "edgetts"

# Set appropriate voice parameters for ebook reading
DefaultRate 0
DefaultPitch 0
DefaultVolume 100

# Enable sentence boundary detection for better segmentation
DefaultBoundary "SentenceBoundary"

EndClient